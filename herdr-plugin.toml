# Install:  herdr plugin install sagwaco/herdr-permissions
# Open:     herdr plugin action invoke herdr-permissions

id = "herdr-permissions"
name = "Permission Approver"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Review agent requests with local filters, TypeSafe Jev, and an agent of your choice; approve reversible ones and leave irreversible actions for a human"
platforms = ["macos"]

[[actions]]
id = "herdr-permissions"
title = "Permissions: approver pane"
contexts = ["global"]
command = ["node", "open.mjs"]

[[panes]]
id = "history"
title = "Permission approver"
placement = "split"
command = ["node", "history-ui.mjs"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "index.mjs", "event"]

[[actions]]
id = "review-pending"
title = "Permissions: review pending requests"
contexts = ["global"]
command = ["node", "index.mjs", "scan"]

[[actions]]
id = "check"
title = "Permissions: check connection"
contexts = ["global"]
command = ["node", "index.mjs", "check"]
